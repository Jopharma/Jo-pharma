<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOPharma - دليل الأدوية والأعشاب والأمراض</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      color: #333;
      padding: 20px;
      position: relative;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    h1 {
      text-align: center;
      color: #0d6efd;
      margin-bottom: 20px;
    }
    /* زر ولوحة الأدمن */
    .admin-btn-top {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 15px;
      background-color: #343a40;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .admin-btn-top:hover { background-color: #23272b; }
    
    #adminPanel {
      display: none;
      border: 2px solid #ffc107;
      background-color: #fffdf5;
    }
    .admin-form input, .admin-form select, .admin-form textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
    }
    .add-btn {
      background-color: #198754;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    /* التابات */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
      justify-content: center;
    }
    .tab-btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #eef2f5;
      color: #555;
      transition: 0.3s;
    }
    .tab-btn.active {
      background-color: #0d6efd;
      color: #fff;
      box-shadow: 0 4px 8px rgba(13, 110, 253, 0.3);
    }
    /* مربع البحث */
    .search-box { margin-bottom: 25px; }
    .search-box input {
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      outline: none;
    }
    .search-box input:focus { border-color: #0d6efd; }
    
    /* الكروت */
    .results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
    }
    .card {
      border: 1px solid #eef2f5;
      background-color: #fafbfc;
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .card-title { font-size: 16px; font-weight: bold; color: #198754; }
