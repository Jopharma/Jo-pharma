function searchDrug() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const resultContainer = document.getElementById('result');
  
  if (query.trim() === "") {
    resultContainer.innerHTML = "<span style='color: red;'>يرجى كتابة اسم الدواء!</span>";
    return;
  }
  
  const found = medicines.filter(med => 
    med.name.toLowerCase().includes(query) || med.active.toLowerCase().includes(query) || med.indication.includes(query)
  );

  if (found.length > 0) {
    let html = "<ul style='list-style: none; padding: 0;'>";
    found.forEach(med => {
      html += `<li style='background: #f1f5f9; margin-bottom: 10px; padding: 15px; border-radius: 8px; text-align: right;'>
      <strong style='font-size: 18px; color: #1e3a8a;'>${med.name}</strong> <br> 
      <span style='color: #475569;'><strong>الاستخدام:</strong> ${med.indication}</span> <br>
      <span style='color: #475569;'><strong>المادة الفعالة:</strong> ${med.active}</span> <br> 
      <span style='color: #475569;'><strong>السعر:</strong> ${med.price}</span> <br> 
      <span style='color: #ea580c;'><strong>البدائل الأردنية:</strong> ${med.alternative}</span></li>`;
    });
    html += "</ul>";
    resultContainer.innerHTML = html;
  } else {
    resultContainer.innerHTML = "<span style='color: orange;'>لم يتم العثور على الدواء في قاعدة البيانات الحالية.</span>";
  }
}
