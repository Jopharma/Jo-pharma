 ["التهاب المسالك البولية","Urinary Tract Infection (UTI)","عدوى بكتيرية تصيب المثانة أو الكلى.","A bacterial infection of the bladder or kidneys.","حرقة عند التبول، كثرة التبول، ألم أسفل البطن، وقد يصاحبها حرارة.","Burning urination, urinary frequency, lower abdominal pain, and possibly fever.","بكتيريا الإشريكية القولونية (E. coli) في الغالب.","Most commonly Escherichia coli (E. coli).","Cipro (سيبروفلوكساسين)، Monurol (فوسفوميسين)؛ مضاد حيوي بوصفة طبية، مع شرب السوائل بكثرة.","Cipro (ciprofloxacin), Monurol (fosfomycin); antibiotics by prescription, with plenty of fluids."],

 ["الربو","Asthma","مرض مزمن يسبب التهاب وتضيق الشعب الهوائية.","A chronic disease causing airway inflammation and narrowing.","ضيق نفس، أزيز، سعال خاصة ليلاً أو عند الجهد.","Shortness of breath, wheezing, and cough, especially at night or during exertion.","مسببات الحساسية (غبار، وبر الحيوانات، حبوب اللقاح)، التدخين، والعدوى.","Allergens (dust, pet dander, pollen), smoking, and respiratory infections.","Ventolin (سالبيوتامول) لتوسيع الشعب عند النوبات، وبخاخات الكورتيزون الوقائية بإشراف الطبيب.","Ventolin (salbutamol) as a reliever; preventive inhaled corticosteroids under medical supervision."],
 ["التهاب المفاصل","Arthritis","التهاب أو تآكل في المفاصل، ومن أشهر أنواعه الفصال العظمي والروماتويدي.","Joint inflammation or degeneration; the most common types are osteoarthritis and rheumatoid arthritis.","ألم، تيبس (خاصة صباحاً)، تورم، وتحدد الحركة.","Pain, stiffness (especially in the morning), swelling, and reduced mobility.","التقدم في العمر والتآكل، أو اضطراب مناعي ذاتي كما في الروماتويد.","Aging and wear-and-tear, or autoimmune disease as in rheumatoid arthritis.","Celebrex (سيليكوكسيب)، Voltaren (ديكلوفيناك)، مع العلاج الطبيعي.","Celebrex (celecoxib), Voltaren (diclofenac), along with physiotherapy."],

 ["ارتفاع الكوليسترول","Hypercholesterolemia","ارتفاع مستوى الدهون (الكوليسترول) في الدم.","Elevated blood cholesterol levels.","لا أعراض عادة، ويُكشف بفحص الدهون في الدم.","Usually asymptomatic; detected by a blood lipid profile.","الدهون المشبعة، قلة الحركة، العوامل الوراثية.","Saturated fats, physical inactivity, and genetic factors.","Lipitor (أتورفاستاتين)، Crestor (روسوفاستاتين)، مع حمية غذائية.","Lipitor (atorvastatin), Crestor (rosuvastatin), along with a healthy diet."],
 ["البواسير","Hemorrhoids","تورم وتمدد في أوردة الشرج والمستقيم.","Swollen and dilated veins in the anus and rectum.","ألم، حكة، ونزيف أحمر فاتح عند التبرز.","Pain, itching, and bright red bleeding during defecation.","الإمساك المزمن، الجهد أثناء التبرز، الحمل، والسمنة.","Chronic constipation, straining, pregnancy, and obesity.","Daflon (ديوزمين/هسبيريدين)، مراهم وتحاميل موضعية، وزيادة الألياف.","Daflon (diosmin/hesperidin), topical ointments and suppositories, and increased fiber."],
 ["قصور الغدة الدرقية","Hypothyroidism","نقص إفراز هرمونات الغدة الدرقية.","Underproduction of thyroid hormones.","زيادة الوزن، خمول، برودة، جفاف الجلد، وإمساك.","Weight gain, lethargy, cold intolerance, dry skin, and constipation.","التهاب الغدة الدرقية المناعي (هاشيموتو) غالباً.","Most commonly autoimmune thyroiditis (Hashimoto's disease).","Thyrox (ليفوثيروكسين) بجرعة يحددها الطبيب حسب فحص TSH.","Thyrox (levothyroxine), at a dose set by the physician based on TSH levels."],
 ["الأرتيكاريا (الشرى)","Urticaria (Hives)","طفح جلدي بارز مصحوب بحكة.","Raised, itchy skin welts.","حكة، احمرار، وانتفاخات جلدية متنقلة.","Itching, redness, and transient raised wheals.","الحساسية من غذاء أو دواء، العدوى، أو أسباب غير معروفة.","Food or drug allergy, infections, or unknown triggers.","Telfast (فيكسوفينادين)، Zyrtec (سيتريزين).","Telfast (fexofenadine), Zyrtec (cetirizine)."],
 ["حب الشباب","Acne Vulgaris","التهاب الغدد الدهنية والجريبات الشعرية.","Inflammation of the sebaceous glands and hair follicles.","بثور، رؤوس سوداء وبيضاء، وقد تترك ندوباً.","Pimples, blackheads, whiteheads, and possible scarring.","التغيرات الهرمونية، فرط الإفراز الدهني، وبكتيريا الجلد.","Hormonal changes, excess sebum, and skin bacteria.","Doxycycline (دوكسيسيكلين) بوصفة طبية، ومستحضرات موضعية مثل البنزويل بيروكسايد.","Doxycycline (by prescription) and topical agents such as benzoyl peroxide."],
 ["التهاب الأذن الوسطى","Otitis Media","التهاب في الأذن الوسطى خلف طبلة الأذن.","Inflammation of the middle ear behind the eardrum.","ألم في الأذن، حرارة، ضعف سمع مؤقت، وطنين.","Ear pain, fever, temporary hearing loss, and tinnitus.","عدوى بكتيرية أو فيروسية، غالباً بعد رشح.","Bacterial or viral infection, often following a cold.","مسكنات الألم؛ Augmentin (أموكسيسيلين/كلافولانيك) عند الحاجة بوصفة طبية؛ قطرات حسب الحالة.","Analgesics; Augmentin (amoxicillin/clavulanate) when indicated and prescribed; ear drops depending on the case."],
 ["هشاشة العظام","Osteoporosis","انخفاض كثافة العظام وزيادة قابليتها للكسر.","Reduced bone density with increased fracture risk.","غالباً صامتة حتى حدوث كسر، وقد يظهر ألم الظهر وانحناء القامة.","Often silent until a fracture occurs; back pain and loss of height may develop.","نقص الكالسيوم وفيتامين D، سن اليأس، والتقدم في العمر.","Calcium and vitamin D deficiency, menopause, and aging.","الكالسيوم وفيتامين D، وأدوية تقوية العظام بإشراف الطبيب.","Calcium and vitamin D, plus bone-strengthening drugs under medical supervision."],
 ["حصى الكلى","Kidney Stones (Nephrolithiasis)","ترسبات معدنية صلبة تتكون في الكلى.","Hard mineral deposits that form in the kidneys.","مغص كلوي شديد يمتد من الخاصرة إلى الأسفل، دم في البول، غثيان.","Severe renal colic radiating from the flank downward, blood in the urine, and nausea.","قلة شرب الماء، حمية غنية بالأملاح والبروتين الحيواني، وعوامل وراثية.","Low fluid intake, high-salt and high-animal-protein diet, and genetic factors.","مسكنات مثل Voltaren (ديكلوفيناك حقن)، وشرب السوائل بكثرة؛ وقد يلزم تفتيت الحصى أو إزالتها.","Analgesics such as Voltaren (diclofenac injection), high fluid intake; stone fragmentation or removal may be needed."],
 ["الأرق","Insomnia","صعوبة في بدء النوم أو الاستمرار فيه.","Difficulty falling or staying asleep.","إرهاق نهاري، ضعف التركيز، وتقلب المزاج.","Daytime fatigue, poor concentration, and mood changes.","التوتر والقلق، عادات نوم سيئة، الكافيين.","Stress and anxiety, poor sleep habits, and caffeine.","تحسين عادات النوم؛ Panadol Night (باراسيتامول + ديفينهيدرامين) لفترة قصيرة؛ أعشاب مهدئة كالمليسة.","Sleep hygiene; Panadol Night (paracetamol + diphenhydramine) short-term; calming herbs such as lemon balm."],
 ["التهاب اللثة","Gingivitis","التهاب اللثة نتيجة تراكم البلاك.","Gum inflammation caused by plaque accumulation.","احمرار وتورم ونزيف اللثة، ورائحة فم كريهة.","Red, swollen, bleeding gums and bad breath.","سوء نظافة الفم وتراكم الجير.","Poor oral hygiene and tartar buildup.","تنظيف الأسنان عند الطبيب، غسول فموي مطهر؛ Flagyl (ميترونيدازول) عند الحاجة بوصفة طبية.","Professional dental cleaning, antiseptic mouthwash; Flagyl (metronidazole) when needed and prescribed."],
 ["دوار الحركة","Motion Sickness","غثيان ودوخة تحدث أثناء السفر.","Nausea and dizziness occurring during travel.","دوخة، غثيان، قيء، وتعرق بارد.","Dizziness, nausea, vomiting, and cold sweats.","تعارض الإشارات بين الأذن الداخلية والبصر أثناء الحركة.","Conflicting signals between the inner ear and vision during movement.","Dramamine (ديمنهيدرينات) قبل السفر بنصف ساعة تقريباً؛ ويمكن أن يخفف Motilium (دومبيريدون) الغثيان.","Dramamine (dimenhydrinate) about 30 minutes before travel; Motilium (domperidone) may relieve nausea."],
 ["التشنج العضلي","Muscle Spasm","انقباض لا إرادي ومؤلم في العضلة.","Sudden, involuntary, and painful muscle contraction.","شد وألم عضلي موضعي.","Localized muscle tightness and pain.","الإجهاد البدني، الجفاف، ونقص الأملاح.","Physical strain, dehydration, and electrolyte imbalance.","Cataflam (ديكلوفيناك)، مراهم موضعية، تمدد وراحة.","Cataflam (diclofenac), topical ointments, stretching, and rest."],
 ["جفاف العين","Dry Eye Syndrome","نقص كمية الدموع أو جودتها.","Insufficient quantity or quality of tears.","حرقة، إحساس بوجود جسم غريب، واحمرار.","Burning, foreign-body sensation, and redness.","الاستخدام المطول للشاشات، الجو الجاف، والتقدم في العمر.","Prolonged screen use, dry environments, and aging.","قطرات الدموع الاصطناعية، وفترات راحة للعين.","Artificial tear drops and regular eye rest."],
 ["عدوى جرثومة المعدة","Helicobacter pylori Infection","عدوى بكتيرية مزمنة في المعدة.","A chronic bacterial infection of the stomach.","غثيان، ألم أو حرقة في المعدة، وانتفاخ.","Nausea, stomach pain or burning, and bloating.","العدوى بجرثومة Helicobacter pylori عبر الطعام والماء الملوثين.","Infection with Helicobacter pylori via contaminated food or water.","علاج ثلاثي أو رباعي: Klacid (كلاريثروميسين)، Amoxil (أموكسيسيلين)، Nexium (إيزوميبرازول)، بوصفة طبية.","Triple or quadruple therapy: Klacid (clarithromycin), Amoxil (amoxicillin), Nexium (esomeprazole), by prescription."],
 ["التهاب القصبات الهوائية","Bronchitis","التهاب الشعب الهوائية.","Inflammation of the bronchial tubes.","سعال مع بلغم، ضيق نفس خفيف، وتعب.","Cough with phlegm, mild shortness of breath, and fatigue.","فيروسات غالباً، والتدخين في الحالات المزمنة.","Mostly viral; smoking in chronic cases.","مقشعات مثل Prospan؛ Zithromax (أزيثروميسين) فقط عند ثبوت عدوى بكتيرية وبوصفة طبية.","Expectorants such as Prospan; Zithromax (azithromycin) only if a bacterial infection is confirmed and prescribed."],
 ["الحزام الناري","Herpes Zoster (Shingles)","طفح مؤلم ناتج عن إعادة تنشيط فيروس الحماق.","A painful rash caused by reactivation of the varicella-zoster virus.","ألم حارق، وطفح حويصلي على شكل شريط في جانب واحد من الجسم.","Burning pain and a blistering rash in a band on one side of the body.","إعادة تنشيط فيروس الحماق (جدري الماء) الكامن في الأعصاب.","Reactivation of latent varicella-zoster (chickenpox) virus in nerve tissue.","Acyclovir (أسيكلوفير) مضاد فيروسي يُبدأ مبكراً، مع مسكنات الألم.","Acyclovir (antiviral) started early, with analgesics."],
 ["التهاب الملتحمة","Conjunctivitis (Pink Eye)","التهاب الغشاء الشفاف الذي يغطي العين.","Inflammation of the thin membrane covering the eye.","احمرار، حكة، دموع أو إفرازات.","Redness, itching, tearing, or discharge.","عدوى فيروسية أو بكتيرية أو حساسية.","Viral or bacterial infection, or allergy.","قطرات مضاد حيوي في الحالات البكتيرية، أو مضاد حساسية في الحالات التحسسية، حسب الطبيب.","Antibiotic drops for bacterial cases, or antihistamine drops for allergic cases, as directed by a physician."],
 ["الدوالي","Varicose Veins","توسع والتواء الأوردة السطحية، وخاصة في الساقين.","Enlarged, twisted superficial veins, especially in the legs.","ألم وثقل في الساق، تورم، وظهور أوردة بارزة.","Leg pain and heaviness, swelling, and visible bulging veins.","الوقوف الطويل، الوراثة، الحمل، والسمنة.","Prolonged standing, genetics, pregnancy, and obesity.","Daflon (ديوزمين/هسبيريدين)، جوارب ضاغطة، وتجنب الوقوف الطويل.","Daflon (diosmin/hesperidin), compression stockings, and avoiding prolonged standing."],
 ["الالتهابات الفطرية الجلدية","Fungal Skin Infections (Tinea)","عدوى فطرية سطحية في الجلد.","Superficial fungal infections of the skin.","حكة، احمرار، وتقشر على شكل حلقات.","Itching, redness, and scaly ring-shaped patches.","فطريات جلدية تنتشر في الأجواء الرطبة.","Dermatophyte fungi that thrive in moist environments.","كريمات مضادة للفطريات (مثل كلوتريمازول أو تيربينافين)، مع إبقاء الجلد جافاً.","Topical antifungal creams (e.g., clotrimazole or terbinafine), while keeping the skin dry."],
 ["الاكتئاب الخفيف","Mild Depression","اضطراب في المزاج يؤثر على الحياة اليومية.","A mood disorder that affects daily functioning.","حزن مستمر، فقدان الاهتمام، تغير الشهية والنوم.","Persistent sadness, loss of interest, and changes in appetite and sleep.","ضغوط نفسية واجتماعية، عوامل وراثية وبيولوجية.","Psychological and social stress, and genetic and biological factors.","العلاج النفسي والدعم الاجتماعي ونمط حياة صحي، واستشارة الطبيب لتقييم الحاجة لدواء.","Psychotherapy, social support, and a healthy lifestyle; consult a physician to assess the need for medication."],
 ["نقص فيتامين د","Vitamin D Deficiency","انخفاض مستوى فيتامين د في الدم، وهو شائع.","Low blood vitamin D level, a common condition.","ألم في العظام والعضلات، تعب، وضعف عام.","Bone and muscle pain, fatigue, and general weakness.","قلة التعرض للشمس، وقلة المصادر الغذائية.","Limited sun exposure and low dietary intake.","Vitamin D3 (كوليكالسيفيرول) بجرعة يحددها الطبيب بحسب نتيجة الفحص.","Vitamin D3 (cholecalciferol) at a dose determined by the physician based on blood tests."],
 ["فتق الحجاب الحاجز (فتق الفرجة)","Hiatal Hernia","انزلاق جزء من المعدة إلى الصدر عبر فتحة الحجاب الحاجز.","Protrusion of part of the stomach into the chest through the diaphragm opening.","حرقة، ارتجاع، وصعوبة في البلع أحياناً.","Heartburn, reflux, and occasional difficulty swallowing.","ضعف عضلات الحجاب الحاجز، السمنة، والسعال المزمن.","Weakened diaphragm muscles, obesity, and chronic cough.","Nexium (إيزوميبرازول) للأعراض، وقد تلزم الجراحة في الحالات الشديدة.","Nexium (esomeprazole) for symptoms; surgery may be required in severe cases."],
 ["التهاب المرارة","Cholecystitis","التهاب المرارة، وغالباً بسبب الحصى.","Inflammation of the gallbladder, usually due to gallstones.","ألم في أعلى البطن الأيمن، غثيان، وحرارة.","Right upper abdominal pain, nausea, and fever.","حصى المرارة التي تسد القناة المرارية، والأطعمة الدسمة كمحرض.","Gallstones obstructing the bile duct; fatty meals may trigger attacks.","مسكنات ومضادات حيوية في المستشفى، وغالباً استئصال المرارة جراحياً.","Analgesics and antibiotics in hospital, and usually surgical removal of the gallbladder."],
 ["الصدفية","Psoriasis","مرض جلدي مناعي مزمن.","A chronic immune-mediated skin disease.","لويحات حمراء مغطاة بقشور فضية، وحكة.","Red plaques covered with silvery scales, with itching.","خلل في الجهاز المناعي مع استعداد وراثي.","Immune dysregulation with genetic predisposition.","مراهم الكورتيزون الموضعية ومرطبات، وعلاجات أخرى بإشراف طبيب الجلدية.","Topical corticosteroids and emollients, and other therapies under a dermatologist."],
 ["الإكزيما (التهاب الجلد التأتبي)","Eczema (Atopic Dermatitis)","التهاب جلدي مزمن مرتبط بالحساسية.","A chronic allergy-related inflammatory skin condition.","حكة، جفاف، واحمرار الجلد.","Itching, dryness, and redness of the skin.","عوامل وراثية، ومحسسات ومهيجات بيئية.","Genetic factors, environmental allergens, and irritants.","مرطبات طبية بانتظام، وكورتيزون موضعي عند اشتداد الأعراض.","Regular medical emollients and topical corticosteroids during flares."],
 ["نقص الكالسيوم","Hypocalcemia (Calcium Deficiency)","انخفاض مستوى الكالسيوم في الدم.","Low blood calcium level.","تشنجات وتنميل في الأطراف والفم، وشد عضلي.","Muscle cramps, numbness and tingling in the extremities and around the mouth.","قلة الكالسيوم في الغذاء، نقص فيتامين د، وبعض الأمراض.","Low dietary calcium, vitamin D deficiency, and certain diseases.","مكملات الكالسيوم وفيتامين د بإشراف الطبيب.","Calcium and vitamin D supplements under medical supervision."],
 ["التهاب البروستاتا","Prostatitis","التهاب غدة البروستاتا.","Inflammation of the prostate gland.","صعوبة وألم في التبول، ألم حوضي، وقد تظهر حرارة.","Difficult or painful urination, pelvic pain, and possibly fever.","عدوى بكتيرية في الغالب.","Most commonly bacterial infection.","Cipro (سيبروفلوكساسين) أو مضاد حيوي مناسب بوصفة طبية ولمدة كافية.","Cipro (ciprofloxacin) or another suitable antibiotic, prescribed for an adequate duration."],
 ["قرح الفم (القلاع)","Aphthous Ulcers (Canker Sores)","تقرحات بيضاء مؤلمة داخل الفم.","Painful white ulcers inside the mouth.","ألم وحرقة، خاصة عند الأكل والكلام.","Pain and burning, especially when eating or speaking.","التوتر، إصابة موضعية، نقص الحديد وفيتامين B12 وحمض الفوليك.","Stress, local trauma, and deficiencies of iron, vitamin B12, or folic acid.","جل فموي موضعي أو غسول مطهر، وتعويض النقص الغذائي إن وُجد.","Topical oral gels or antiseptic rinses, and correction of any nutritional deficiency."],
 ["سلس البول الليلي عند الأطفال","Nocturnal Enuresis (Bedwetting)","التبول اللاإرادي أثناء النوم عند الأطفال.","Involuntary urination during sleep in children.","تبول ليلي متكرر.","Recurrent nighttime urination.","عوامل وراثية، تأخر نضج التحكم بالمثانة، أو أسباب نفسية وعضوية.","Genetic factors, delayed bladder control maturation, or psychological and organic causes.","تعديل السلوك والتقليل من السوائل مساءً؛ والعلاج الدوائي حسب تقييم الطبيب.","Behavioral measures and limiting evening fluids; medication only after medical evaluation."],
 ["الكبد الدهني","Fatty Liver Disease (Steatotic Liver Disease)","تراكم الدهون في خلايا الكبد.","Excess fat accumulation in liver cells.","غالباً بلا أعراض، وقد يظهر إرهاق وانزعاج في أعلى البطن.","Often asymptomatic; fatigue and upper abdominal discomfort may occur.","السمنة، مقاومة الإنسولين، وارتفاع الدهون.","Obesity, insulin resistance, and high blood lipids.","إنقاص الوزن، حمية صحية، نشاط بدني؛ وقد يُستعمل شوك الجمل (ميلك ثيسل) كمساعد.","Weight loss, a healthy diet, and exercise; milk thistle may be used as an adjunct."],
 ["التهاب الأوتار","Tendinitis","التهاب أو إجهاد في الوتر.","Inflammation or irritation of a tendon.","ألم وتورم قرب المفصل، يزداد بالحركة.","Pain and swelling near a joint that worsens with movement.","الإفراط في الحركة المتكررة أو الرياضة.","Overuse from repetitive movement or sports.","راحة، كمادات باردة، Voltaren (ديكلوفيناك) موضعي أو فموي، وعلاج طبيعي.","Rest, cold compresses, Voltaren (diclofenac) topical or oral, and physiotherapy."],
 ["التهاب الزائدة الدودية","Appendicitis","التهاب حاد في الزائدة الدودية، وهو حالة طارئة.","Acute inflammation of the appendix; a medical emergency.","ألم يبدأ حول السرة ثم ينتقل إلى أسفل البطن الأيمن، غثيان، وحرارة.","Pain that begins around the navel then shifts to the right lower abdomen, with nausea and fever.","انسداد تجويف الزائدة.","Obstruction of the appendiceal lumen.","جراحة عاجلة؛ راجع الطوارئ فوراً ولا تتناول مسكنات قبل التشخيص.","Urgent surgery; go to the emergency department immediately and avoid painkillers before diagnosis."],
 ["متلازمة التعب المزمن","Chronic Fatigue Syndrome","إرهاق مستمر غير مبرر لا يزول بالراحة.","Persistent, unexplained fatigue that is not relieved by rest.","تعب شديد، مشاكل في التركيز والنوم، وآلام عضلية.","Profound fatigue, poor concentration and sleep, and muscle pain.","السبب غير معروف، وتُدرس عوامل فيروسية ومناعية.","The cause is unknown; viral and immune factors are under study.","علاج داعم: تنظيم النشاط، النوم الجيد، تقييم نقص الفيتامينات، وإشراف الطبيب.","Supportive care: activity pacing, good sleep, evaluation for vitamin deficiencies, and medical follow-up."]
];
const herbsList = [
 ["البابونج","Chamomile","يساعد على الاسترخاء وتحسين النوم، ويخفف تشنجات الجهاز الهضمي.","Promotes relaxation and sleep, and relieves digestive spasms.","تُنقع ملعقة صغيرة من الأزهار المجففة في كوب ماء مغلي 5–10 دقائق، ثم تُصفّى وتُشرب مرة إلى مرتين يومياً. يُحذر منها لمن لديهم حساسية من نباتات الفصيلة النجمية.","Steep 1 teaspoon of dried flowers in a cup of boiling water for 5–10 minutes, strain, and drink once or twice daily. Avoid if allergic to plants of the daisy family."],
 ["اليانسون","Anise","يعمل كطارد للغازات ومقشّع يساعد على تخفيف السعال وإخراج البلغم.","Acts as a carminative and expectorant, easing cough and loosening phlegm.","تُغلى ملعقة صغيرة من البذور 3 دقائق، ثم يُغطى الكوب وتُترك المنقوعة لتفتر قبل شربها.","Boil 1 teaspoon of seeds for 3 minutes, cover, and let it cool slightly before drinking."],
 ["الزعتر","Thyme","له خصائص مضادة للميكروبات ومقشّعة، ويفيد في السعال والتهاب الحلق.","Has antimicrobial and expectorant properties; useful for cough and sore throat.","يُحضّر كمنقوع بنقعه في ماء مغلي 10 دقائق، أو يُستخدم كغرغرة للحلق.","Prepare as an infusion by steeping in boiling water for 10 minutes, or use as a gargle for the throat."],
 ["المرمية","Sage","تدعم الذاكرة والهضم، وتخفف التعرق الزائد وبعض أعراض سن اليأس.","Supports memory and digestion, and may reduce excessive sweating and some menopausal symptoms.","تُنقع الأوراق في ماء مغلي 5 دقائق. تُتجنب أثناء الحمل والرضاعة، ولا يُنصح بالإكثار منها.","Steep the leaves in boiling water for 5 minutes. Avoid during pregnancy and breastfeeding, and do not use in excess."],
 ["النعناع","Peppermint","يخفف أعراض القولون العصبي وعسر الهضم والغثيان.","Relieves symptoms of irritable bowel syndrome, indigestion, and nausea.","تُنقع أوراقه الطازجة أو المجففة في ماء ساخن وتُشرب بعد الوجبات. قد يزيد الحرقة لدى مرضى الارتجاع المعدي المريئي.","Steep fresh or dried leaves in hot water and drink after meals. May worsen heartburn in people with GERD."],
 ["الزنجبيل","Ginger","يخفف الغثيان (ومنه غثيان السفر والحمل)، وله تأثير مضاد للالتهاب.","Relieves nausea (including motion sickness and morning sickness) and has anti-inflammatory effects.","يُقطّع أو يُبشر الجذر الطازج ويُغلى 5 دقائق، ويمكن إضافة العسل والليمون. يُستشار الطبيب عند تناول أدوية مميعة للدم.","Slice or grate fresh root and boil for 5 minutes; honey and lemon may be added. Consult a physician if you take blood thinners."],
 ["القرفة","Cinnamon","قد تساهم بشكل محدود في تحسين حساسية الإنسولين وضبط سكر الدم.","May modestly improve insulin sensitivity and blood sugar control.","تُغلى أعواد القرفة أو يُضاف مسحوقها بكميات قليلة للمشروبات الدافئة. على مرضى السكري استشارة الطبيب، ولا تغني عن علاجهم.","Boil cinnamon sticks or add small amounts of powder to warm drinks. People with diabetes should consult a physician; it does not replace medication."],
 ["الكركم","Turmeric","يحتوي على الكركمين ذي الخصائص المضادة للأكسدة والالتهاب، وقد يخفف آلام المفاصل.","Contains curcumin, with antioxidant and anti-inflammatory properties that may ease joint pain.","يُخلط مع قليل من الفلفل الأسود وحليب أو ماء دافئ لتحسين الامتصاص. يُتجنب عند وجود حصى مرارية أو أثناء تناول مميعات الدم.","Mix with a pinch of black pepper in warm milk or water to improve absorption. Avoid with gallstones or while taking blood thinners."],
 ["الكمون","Cumin","يساعد على الهضم ويخفف الانتفاخ والغازات.","Aids digestion and relieves bloating and gas.","تُغلى ملعقة صغيرة من البذور وتُشرب دافئة قبل أو بعد الوجبات.","Boil 1 teaspoon of seeds and drink warm before or after meals."],
 ["إكليل الجبل (الروزماري)","Rosemary","غني بمضادات الأكسدة، ويُستخدم تقليدياً لتنشيط التركيز والذاكرة.","Rich in antioxidants and traditionally used to support concentration and memory.","يُستعمل كمنقوع دافئ أو كنكهة للطعام بكميات معتدلة. يُتجنب بجرعات علاجية أثناء الحمل.","Use as a warm infusion or as a culinary herb in moderate amounts. Avoid therapeutic doses during pregnancy."],
 ["الشمرة (الشومر)","Fennel","يخفف الانتفاخ والمغص ويُستعمل تقليدياً لتحفيز إدرار الحليب.","Relieves bloating and cramps and is traditionally used to support lactation.","تُهرس البذور وتُنقع في ماء ساخن 10 دقائق ثم تُصفّى. استشر الطبيب قبل إعطائها للرضع أو الإكثار منها أثناء الرضاعة.","Crush the seeds, steep in hot water for 10 minutes, and strain. Consult a physician before giving it to infants or using large amounts while breastfeeding."],
 ["البقدونس","Parsley","له تأثير مُدرّ للبول خفيف ويدعم وظيفة الكلى.","Has a mild diuretic effect and supports kidney function.","يُغلى كوب من الأوراق الطازجة المفرومة ويُشرب كوب واحد يومياً. يُتجنب بكميات علاجية أثناء الحمل ولمرضى الكلى دون استشارة الطبيب.","Simmer a cup of chopped fresh leaves and drink one cup daily. Avoid therapeutic amounts during pregnancy and in kidney disease without medical advice."],
 ["المليسة (الترنجان)","Lemon Balm","تخفف القلق والتوتر الخفيف وتساعد على النوم.","Eases mild anxiety and stress and helps promote sleep.","تُنقع الأوراق الطازجة أو المجففة في ماء مغلي 5–10 دقائق وتُشرب مساءً.","Steep fresh or dried leaves in boiling water for 5–10 minutes and drink in the evening."],
 ["حبة البركة","Black Seed (Nigella sativa)","قد تدعم المناعة وتملك خصائص مضادة للأكسدة، لكن الأدلة السريرية عليها لا تزال محدودة.","May support immunity and has antioxidant properties, although clinical evidence remains limited.","تُطحن طازجة وتُخلط مع العسل بكمية صغيرة. تُتجنب أثناء الحمل، وتُستشار الطبيب عند تناول أدوية السكري أو ضغط الدم.","Grind fresh and mix a small amount with honey. Avoid during pregnancy; consult a physician if taking diabetes or blood pressure medication."],

document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'); if (g) { location.hash = g.dataset.go; return }
  if (e.target.closest('[data-more]')) { lim += 20; return doSearch() }
  const c = e.target.closest('[data-cat]'); if (c) { $('#fc').value = c.dataset.cat; $('#q').value = ''; location.hash = 'search'; return doSearch() }
  const qb = e.target.closest('[data-q]'); if (qb) { $('#q').value = qb.dataset.q; $('#q').dispatchEvent(new Event('input')); lim = 20; location.hash = 'search'; doSearch(); scrollTo({ top: 0, behavior: 'smooth' }); return }
  const fv = e.target.closest('[data-fav]'); if (fv) { const id = fv.dataset.fav; favs.has(id) ? favs.delete(id) : favs.add(id); ls.set('jp_fav', [...favs]); fv.textContent = favs.has(id) ? '★' : '☆'; if (favOnly) doSearch(); toast(favs.has(id) ? t('favOn') : t('favOff')); return }
  const sh = e.target.closest('[data-share]'); if (sh) { const m = meds.find(x => x.id === sh.dataset.share), txt = `${m.name} | ${m.active} | ${m.price}`; if (navigator.share) { try { await navigator.share({ title: 'Jo Pharma', text: txt, url: location.href.split('#')[0] }) } catch {} } else { await copyText(txt); toast(t('copied')) } return }
  const qb = e.target.closest('[data-q]'); if (qb) { $('#q').value = qb.dataset.q; $('#q').dispatchEvent(new Event('input')); lim = 20; location.hash = 'search'; doSearch(); scrollTo({ top: 0, behavior: 'smooth' }); return }
  const fv = e.target.closest('[data-fav]'); if (fv) { const id = fv.dataset.fav; favs.has(id) ? favs.delete(id) : favs.add(id); ls.set('jp_fav', [...favs]); fv.textContent = favs.has(id) ? '★' : '☆'; if (favOnly) doSearch(); toast(favs.has(id) ? t('favOn') : t('favOff')); return }
  const sh = e.target.closest('[data-share]'); if (sh) { const m = meds.find(x => x.id === sh.dataset.share), txt = `${m.name} | ${m.active} | ${m.price}`; if (navigator.share) { try { await navigator.share({ title: 'Jo Pharma', text: txt, url: location.href.split('#')[0] }) } catch {} } else { await copyText(txt); toast(t('copied')) } return }
  const cp = e.target.closest('[data-copy]');
  if (cp) { const m = meds.find(x => x.id === cp.dataset.copy); await copyText(`${m.name} | ${m.active} | ${m.price}`); toast(t('copied')) }
});

  const dl = document.createElement('datalist'); dl.id = 'dl'; document.body.append(dl); $('#q').setAttribute('list', 'dl');

  addEventListener('keydown', e => { if (e.key === 'Escape' && $('#q').value) $('#clr').click() });
  addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); location.hash = 'search'; $('#q').focus() } });
})();
